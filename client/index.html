<!DOCTYPE html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- iOS-specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Glas Politics" />
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#0D1310" />
    <meta name="msapplication-TileColor" content="#0D1310" />
    
    <!-- SEO & Social -->
    <meta name="description" content="Discover your political alignment, match with Irish parties, track pledges, and engage with Irish democracy." />
    <meta name="keywords" content="Irish politics, political compass, Dáil Éireann, Irish elections, political quiz, Ireland" />
    <meta name="author" content="Glas Politics" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Glas Politics - Irish Political Compass" />
    <meta property="og:description" content="Find your place in Irish politics. Take the quiz, discover your party matches, and track accountability." />
    <meta property="og:image" content="/favicon.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glas Politics - Irish Political Compass" />
    <meta name="twitter:description" content="Find your place in Irish politics. Take the quiz, discover your party matches." />
    
    <title>Glas Politics - Your Dáil, scored</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" />

    <!-- Set the theme class before first paint so there is no flash of the wrong theme. -->
    <script>
      (function () {
        var theme = 'dark';
        try { theme = localStorage.getItem('glas-theme') || 'dark'; } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        try {
          var region = localStorage.getItem('glas.region');
          if (region === 'IE' || region === 'UK' || region === 'US') document.documentElement.classList.add('region-' + region.toLowerCase());
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
