# Runs on every PR and every push to main. The job names are the required-check names.
# Never add path filters: a required check that does not run blocks the PR as "Expected".
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # Each integration suite creates its own <db>_<suffix> database from this URL.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json
      # Without a database the integration suites skip and vitest still exits 0.
      - name: Integration suites actually ran
        run: node -e "const r=require('./vitest-report.json'); console.log('tests', r.numTotalTests, 'skipped', r.numPendingTests); if (r.numTotalTests === 0 || r.numPendingTests > 0) process.exit(1)"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # deploy/compose.yml and docs/deploy.md depend on the production image, which nothing else builds.
  # It has to build, boot and serve the client with no database behind it (the start-up check is
  # non-blocking), and stop cleanly when told to.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build -t glasapp:ci --build-arg VITE_SUPABASE_ANON_KEY=ci-placeholder-key .
      - name: The image starts, answers /health, and serves the client
        run: |
          docker run -d --name glasapp-ci -p 5000:5000 \
            -e DATABASE_URL=postgres://u:p@127.0.0.1:1/x -e SUPABASE_URL=http://localhost:54321 \
            -e SUPABASE_ANON_KEY=ci-placeholder-key -e SCHEDULER=off glasapp:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:5000/health
          curl -fsS http://127.0.0.1:5000/ | grep -q 'id="root"'
          docker exec glasapp-ci node -e "process.exit(process.getuid() === 0 ? 1 : 0)"
      - name: It stops on SIGTERM without being killed
        run: |
          docker stop --time 15 glasapp-ci
          test "$(docker inspect glasapp-ci --format '{{.State.ExitCode}}')" = 0
      - if: failure()
        run: docker logs glasapp-ci || true

  migration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      # PR: the merge commit's first parent is the base branch tip. Push: the commit
      # before the push (origin/main would equal HEAD and prove nothing).
      - name: Resolve base commit
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then BASE=$(git rev-parse HEAD^1)
          else BASE="$BEFORE"; git fetch --no-tags --depth=1 origin "$BASE"; fi
          git cat-file -e "$BASE^{commit}"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx drizzle-kit check
      - run: npx tsx scripts/ci/check-migrations.ts --base "$BASE"

  # Browser e2e: production build + throwaway <db>_e2e database (playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      # No browser cache: restoring it takes about as long as the download.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
